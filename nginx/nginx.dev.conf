# ─────────────────────────────────────────────────────────────
# NGINX DEV CONFIG
#
# Nginx sits in front of everything and routes traffic:
#
#   Browser → Nginx :80 → /api/*   → Django :8000
#                       → /*       → React  :5173
#
# WHY use Nginx even in dev?
# It mirrors production exactly, so there are no surprises.
# No "it worked on my machine" issues with CORS or routing.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name localhost;

    # ── Gzip compression ──────────────────────────────────────
    # Compresses responses before sending. Reduces bandwidth ~70%.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ── Client upload limit ───────────────────────────────────
    # For profile picture uploads — adjust as needed
    client_max_body_size 10M;

    # ── API → Django ──────────────────────────────────────────
    # Any request starting with /api/ or /admin/ → Django backend
    location ~ ^/(api|admin|media|static)/ {
        proxy_pass http://backend:8000;

        # Pass original client info to Django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ── Frontend → React (Vite dev server) ───────────────────
    # Everything else → React frontend
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;

        # WebSocket support for Vite HMR (Hot Module Replacement)
        # Without this, changes in your React code won't auto-refresh
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Health check ─────────────────────────────────────────
    # Used by Docker and load balancers to verify Nginx is alive
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
