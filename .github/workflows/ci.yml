# ─────────────────────────────────────────────────────────────
# CI PIPELINE — runs on every Pull Request to main
#
# Jobs:
#   1. backend-tests  → pytest with coverage
#   2. frontend-tests → vitest
#   3. docker-build   → verify docker-compose builds without errors
#
# WHY CI on PRs (not just on merge)?
# Catch broken code BEFORE it merges — not after.
# ─────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ── 1. BACKEND TESTS ────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest

    services:
      # Spin up a real PostgreSQL for tests (not a mock)
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: hospital_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements/dev.txt

      - name: Run tests with coverage
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: hospital_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/hospital_test
          REDIS_URL: redis://localhost:6379/0
          CORS_ALLOWED_ORIGINS: http://localhost:5173
        run: |
          cd backend
          pytest --cov=apps --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml

  # ── 2. FRONTEND TESTS ───────────────────────────────────────
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Run tests
        run: cd frontend && npm run test -- --run

  # ── 3. DOCKER BUILD CHECK ───────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]  # only run if tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cp .env.example .env
          sed -i 's/your-super-secret-key-here/ci-secret-key/' .env

      - name: Build Docker images
        run: docker-compose build

      - name: Verify containers start
        run: |
          docker-compose up -d
          sleep 15
          docker-compose ps
          docker-compose down
