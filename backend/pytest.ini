[pytest]
# Tell pytest-django where our settings are
DJANGO_SETTINGS_MODULE = config.settings.dev

# Where to find tests
testpaths = tests apps

# Verbose output + show print() statements
addopts =
    -v
    -s
    --tb=short
    --strict-markers

# Custom markers (used in tests to categorize them)
markers =
    unit: Unit tests (no DB, no external services)
    integration: Integration tests (uses DB)
    slow: Slow tests (skip with -m "not slow")
